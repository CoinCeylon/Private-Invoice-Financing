# All relative paths are resolved from the FIRST Compose file: the repo root.
services:
  dev:
    build:
      context: .
      dockerfile: .devcontainer/Dockerfile
      args:
        PNPM_VERSION: "${PNPM_VERSION:?Set the teams exact PNPM_VERSION in .env}"
        AIKEN_VERSION: "${AIKEN_VERSION:?Set AIKEN_VERSION in .env, including the v prefix}"
        COMPACT_VERSION: "${COMPACT_VERSION:?Set P4s exact COMPACT_VERSION in .env}"
    init: true
    command: ["sleep", "infinity"]
    working_dir: /workspaces/invoice-financing
    volumes:
      - .:/workspaces/invoice-financing:cached
      # Installed dependencies live in Docker volumes, not in the bind mount. On Windows the bind mount
      # is very slow and sometimes stalls, and tools that load thousands of files (Prisma, vitest) hang.
      # The source stays on the host; only these folders are hidden behind volumes inside the container.
      - root_node_modules:/workspaces/invoice-financing/node_modules
      - web_node_modules:/workspaces/invoice-financing/apps/web/node_modules
      - api_node_modules:/workspaces/invoice-financing/apps/api/node_modules
      - shared_node_modules:/workspaces/invoice-financing/packages/shared/node_modules
      - extraction_venv:/workspaces/invoice-financing/services/extraction/.venv
    environment:
      PGHOST: postgres
      PGPORT: "5432"
      PGUSER: "${POSTGRES_USER:?Set POSTGRES_USER in .env}"
      PGPASSWORD: "${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}"
      PGDATABASE: "${POSTGRES_DB:?Set POSTGRES_DB in .env}"
      DATABASE_URL: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}"
      PROOF_SERVER_URL: http://proof-server:6300
      VITE_PROOF_SERVER_URL: http://localhost:6300
    depends_on:
      postgres:
        condition: service_healthy
      proof-server:
        condition: service_started

volumes:
  root_node_modules:
  web_node_modules:
  api_node_modules:
  shared_node_modules:
  extraction_venv:
